name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test

      # The same key every time lets a new APK install over the old one.
      # Without these secrets the build uses a throwaway debug key instead.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Signing secrets are not set. This APK cannot update an earlier one."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=univapayment"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties

      - name: Build APK
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          flutter build apk --release --target-platform android-arm64 \
            --build-number="$GITHUB_RUN_NUMBER" --dart-define=API_URL="$API_URL"
          mv build/app/outputs/flutter-apk/app-release.apk \
            "UnivaPayment-build-$GITHUB_RUN_NUMBER.apk"

      - name: Publish the APK and link it on the commit
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          APK="UnivaPayment-build-$GITHUB_RUN_NUMBER.apk"
          TAG="build-$GITHUB_RUN_NUMBER"
          SHORT_SHA="${GITHUB_SHA::7}"
          printf 'Built from %s.\n\n%s\n' "$GITHUB_SHA" "${COMMIT_MESSAGE:-Manual run}" > notes.txt
          gh release create "$TAG" "$APK" --target "$GITHUB_SHA" \
            --title "Build $GITHUB_RUN_NUMBER ($SHORT_SHA)" --notes-file notes.txt --prerelease
          LINK="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG/$APK"
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" -f body="[Download APK]($LINK) (build $GITHUB_RUN_NUMBER)"
          echo "### [Download APK]($LINK)" >> "$GITHUB_STEP_SUMMARY"
